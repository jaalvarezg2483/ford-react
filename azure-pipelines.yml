name: FordCR-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: restoreCmsContent
    displayName: Importar contenido inicial de ford.cr en Azure
    type: boolean
    default: false

trigger:
  branches:
    include:
      - feature/ford-react-railway
  paths:
    include:
      - '**'

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  serviceConnection: 'fordcr-webdeploy-sc-v1'
  appServiceName: 'gp-fordcr-app-v1'
  resourceGroup: 'gpmwebcms-pro-rg'
  artifactName: 'fordcr-app'

stages:
  - stage: Build
    displayName: Build Ford site and CMS
    jobs:
      - job: Build
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: Use Node.js $(nodeVersion)

          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Install locked dependencies

          - script: npm run build
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Build React site and Payload CMS

          # The build needs dev dependencies; the App Service package only gets
          # the CMS runtime dependencies. Never package local environment files.
          - script: |
              set -euo pipefail
              npm ci --omit=dev --prefix cms
              app="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$app"
              rsync -a --exclude='node_modules' --exclude='.env*' cms/ "$app/cms/"
              cp -R cms/node_modules "$app/cms/node_modules"
              cp -R dist "$app/dist"
              cp -R public "$app/public"
              mkdir -p "$app/src/lib"
              cp src/lib/seo.mjs "$app/src/lib/seo.mjs"
              cp -R src/lib/heads "$app/src/lib/heads"
              cd "$app"
              zip -qr "$(Build.ArtifactStagingDirectory)/fordcr.zip" .
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Assemble production package

          - publish: $(Build.ArtifactStagingDirectory)/fordcr.zip
            artifact: $(artifactName)
            displayName: Publish deploy package

  - stage: Staging
    displayName: Deploy staging slot
    dependsOn: Build
    jobs:
      - job: DeployStaging
        timeoutInMinutes: 90
        steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureCLI@2
            displayName: Configure Ford staging identity and diagnostics
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appServiceName)" \
                  --slot staging \
                  --slot-settings ENTRA_BOOTSTRAP_ADMIN_EMAILS=jaalvarezg@grupopurdy.com PG_POOL_MAX=5 \
                  --output none
                az webapp log config \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appServiceName)" \
                  --slot staging \
                  --application-logging filesystem \
                  --web-server-logging filesystem \
                  --docker-container-logging filesystem \
                  --level verbose \
                  --output none
          - task: AzureWebApp@1
            displayName: Deploy to Ford staging
            inputs:
              azureSubscription: $(serviceConnection)
              appType: webAppLinux
              appName: $(appServiceName)
              deployToSlotOrASE: true
              resourceGroupName: $(resourceGroup)
              slotName: staging
              package: $(Pipeline.Workspace)/$(artifactName)/fordcr.zip
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'node cms/server.mjs'
              deploymentMethod: zipDeploy

          - bash: |
                    set -euo pipefail
                    for attempt in $(seq 1 12); do
                      liveness=$(curl --silent --connect-timeout 4 --max-time 6 --output /dev/null --write-out '%{http_code}' https://gp-fordcr-app-v1-staging.azurewebsites.net/healthz || true)
                      readiness=$(curl --silent --connect-timeout 4 --max-time 6 --output /dev/null --write-out '%{http_code}' https://gp-fordcr-app-v1-staging.azurewebsites.net/api/health || true)
                      if [ "$liveness" = "200" ] && [ "$readiness" = "200" ]; then
                        echo 'Ford staging process and database health checks passed.'
                        exit 0
                      fi
                      echo "Staging liveness/readiness returned $liveness/$readiness (attempt $attempt/12)."
                      sleep 5
                    done
                    echo 'Ford staging did not become healthy.'
                    exit 1
            displayName: Verify staging health endpoint

          - ${{ if eq(parameters.restoreCmsContent, true) }}:
            - task: AzureCLI@2
              displayName: Restore Ford content to staging
              inputs:
                azureSubscription: $(serviceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  token="$(($(date +%s) + 5400)).$(openssl rand -hex 32)"
                  response="$(Agent.TempDirectory)/ford-import-start.json"
                  status_file="$(Agent.TempDirectory)/ford-import-status.json"
                  catalog="$(Agent.TempDirectory)/ford-import-catalog.json"
                  cookie_jar="$(Agent.TempDirectory)/ford-import-cookies.txt"
                  endpoint="https://gp-fordcr-app-v1-staging.azurewebsites.net/api/import-ford/bootstrap"
                  touch "$cookie_jar"
                  cleanup() {
                    az webapp config appsettings delete \
                      --resource-group "$(resourceGroup)" --name "$(appServiceName)" --slot staging \
                      --setting-names FORD_IMPORT_BOOTSTRAP_TOKEN --output none || true
                  }
                  trap cleanup EXIT
                  az webapp config appsettings set \
                    --resource-group "$(resourceGroup)" --name "$(appServiceName)" --slot staging \
                    --slot-settings "FORD_IMPORT_BOOTSTRAP_TOKEN=$token" --output none
                  az webapp restart --resource-group "$(resourceGroup)" --name "$(appServiceName)" --slot staging
                  sleep 10
                  for attempt in $(seq 1 24); do
                    if curl --silent --fail --connect-timeout 4 --max-time 8 \
                      https://gp-fordcr-app-v1-staging.azurewebsites.net/healthz -o /dev/null; then
                      break
                    fi
                    if [ "$attempt" = 24 ]; then echo 'Ford staging did not restart with the temporary import token.'; exit 1; fi
                    sleep 5
                  done
                  start_code=$(curl --silent --show-error --max-time 20 -o "$response" -w '%{http_code}' \
                    -c "$cookie_jar" -b "$cookie_jar" -X POST -H "X-Ford-Import-Token: $token" "$endpoint")
                  if [ "$start_code" != "202" ]; then
                    echo "Ford staging import could not start (HTTP $start_code)."
                    cat "$response"
                    exit 1
                  fi
                  node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.started) process.exit(1)' "$response"
                  echo 'Ford staging content import started.'
                  completed=false
                  for attempt in $(seq 1 240); do
                    code=$(curl --silent --show-error --max-time 20 -o "$status_file" -w '%{http_code}' \
                      -c "$cookie_jar" -b "$cookie_jar" -H "X-Ford-Import-Token: $token" "$endpoint" || true)
                    if [ "$code" != "200" ]; then
                      echo "Ford staging import status returned HTTP $code (attempt $attempt/240)."
                      sleep 15
                      continue
                    fi
                    state=$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.error){console.error("Ford staging import error: "+String(x.error).slice(0,800));process.exit(2)} console.log(x.running?"running":(x.finishedAt?"finished":"idle"))' "$status_file") || exit 1
                    if [ "$state" = "finished" ]; then completed=true; break; fi
                    if [ "$state" = "idle" ]; then echo 'Ford staging import ended without a completion time.'; exit 1; fi
                    if [ "$((attempt % 4))" = 0 ]; then echo "Ford staging import still running (check $attempt/240)."; fi
                    sleep 15
                  done
                  if [ "$completed" != true ]; then echo 'Ford staging import exceeded the 60-minute limit.'; exit 1; fi
                  curl --silent --show-error --fail --max-time 60 \
                    https://gp-fordcr-app-v1-staging.azurewebsites.net/api/site-content -o "$catalog"
                  node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const c={families:x.families?.length||0,posts:x.posts?.length||0,videos:x.videos?.length||0,slides:x.home?.slides?.length||0,pages:x.pages?.length||0,familyTypes:x.site?.familyTypes?.length||0}; console.log("Ford staging content counts: "+JSON.stringify(c)); if(c.families<10||c.posts<20||c.videos<5||c.slides<5||c.pages<10||c.familyTypes<3) process.exit(1)' "$catalog"

          - task: AzureCLI@2
            displayName: Summarize staging startup diagnostics on failure
            condition: failed()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                archive="$(Agent.TempDirectory)/ford-staging-logs.zip"
                if ! az webapp log download --resource-group "$(resourceGroup)" --name "$(appServiceName)" --slot staging --log-file "$archive" --output none; then
                  echo 'Azure could not provide the staging filesystem logs.'
                  exit 0
                fi
                python3 - "$archive" <<'PY'
                import re, sys, zipfile
                archive = sys.argv[1]
                matches = re.compile(r'(error|exception|failed|cannot|unable|module not found|listening|ready|started|crash|fatal|startupfailure|exit code)', re.I)
                secrets = re.compile(r'''(?i)["']?(password|secret|token|authorization|connectionstring)["']?\s*[:=]\s*["']?([^"',;}\s]+)''')
                url_credentials = re.compile(r'(?i)(postgres(?:ql)?://)[^:@/\s]+:[^@/\s]+@')
                shown = 0
                with zipfile.ZipFile(archive) as z:
                    for name in z.namelist():
                        if not name.lower().endswith(('.log', '.txt', '.xml')):
                            continue
                        print(f'--- {name} ---')
                        lines = z.read(name).decode('utf-8', errors='replace').splitlines()
                        for line in lines[-250:]:
                            if matches.search(line):
                                line = secrets.sub(r'\1=[REDACTED]', line)
                                line = url_credentials.sub(r'\1[REDACTED]@', line)
                                print(line[:1200])
                                shown += 1
                                if shown >= 60:
                                    break
                        if shown >= 60:
                            break
                if not shown:
                    print('No startup or error lines matched in the recent log files.')
                PY

  - stage: Production
    displayName: Deploy production
    dependsOn: Staging
    condition: succeeded()
    jobs:
      - job: DeployProduction
        timeoutInMinutes: 90
        steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureCLI@2
            displayName: Configure Ford production identity and connection pool
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appServiceName)" \
                  --slot-settings ENTRA_BOOTSTRAP_ADMIN_EMAILS=jaalvarezg@grupopurdy.com PG_POOL_MAX=10 \
                  --output none
          - task: AzureWebApp@1
            displayName: Deploy to Ford production
            inputs:
              azureSubscription: $(serviceConnection)
              appType: webAppLinux
              appName: $(appServiceName)
              package: $(Pipeline.Workspace)/$(artifactName)/fordcr.zip
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'node cms/server.mjs'
              deploymentMethod: zipDeploy

          - bash: |
                    set -euo pipefail
                    for attempt in $(seq 1 12); do
                      liveness=$(curl --silent --connect-timeout 4 --max-time 6 --output /dev/null --write-out '%{http_code}' https://gp-fordcr-app-v1.azurewebsites.net/healthz || true)
                      readiness=$(curl --silent --connect-timeout 4 --max-time 6 --output /dev/null --write-out '%{http_code}' https://gp-fordcr-app-v1.azurewebsites.net/api/health || true)
                      if [ "$liveness" = "200" ] && [ "$readiness" = "200" ]; then
                        echo 'Ford production process and database health checks passed.'
                        exit 0
                      fi
                      echo "Production liveness/readiness returned $liveness/$readiness (attempt $attempt/12)."
                      sleep 5
                    done
                    echo 'Ford production did not become healthy.'
                    exit 1
            displayName: Verify production health endpoint

          - ${{ if eq(parameters.restoreCmsContent, true) }}:
            - task: AzureCLI@2
              displayName: Restore Ford content to production
              inputs:
                azureSubscription: $(serviceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  token="$(($(date +%s) + 5400)).$(openssl rand -hex 32)"
                  response="$(Agent.TempDirectory)/ford-import-start.json"
                  status_file="$(Agent.TempDirectory)/ford-import-status.json"
                  catalog="$(Agent.TempDirectory)/ford-import-catalog.json"
                  cookie_jar="$(Agent.TempDirectory)/ford-import-cookies.txt"
                  endpoint="https://gp-fordcr-app-v1.azurewebsites.net/api/import-ford/bootstrap"
                  touch "$cookie_jar"
                  cleanup() {
                    az webapp config appsettings delete \
                      --resource-group "$(resourceGroup)" --name "$(appServiceName)" \
                      --setting-names FORD_IMPORT_BOOTSTRAP_TOKEN --output none || true
                  }
                  trap cleanup EXIT
                  az webapp config appsettings set \
                    --resource-group "$(resourceGroup)" --name "$(appServiceName)" \
                    --settings "FORD_IMPORT_BOOTSTRAP_TOKEN=$token" --output none
                  az webapp restart --resource-group "$(resourceGroup)" --name "$(appServiceName)"
                  sleep 10
                  for attempt in $(seq 1 24); do
                    if curl --silent --fail --connect-timeout 4 --max-time 8 \
                      https://gp-fordcr-app-v1.azurewebsites.net/healthz -o /dev/null; then
                      break
                    fi
                    if [ "$attempt" = 24 ]; then echo 'Ford production did not restart with the temporary import token.'; exit 1; fi
                    sleep 5
                  done
                  start_code=$(curl --silent --show-error --max-time 20 -o "$response" -w '%{http_code}' \
                    -c "$cookie_jar" -b "$cookie_jar" -X POST -H "X-Ford-Import-Token: $token" "$endpoint")
                  if [ "$start_code" != "202" ]; then
                    echo "Ford production import could not start (HTTP $start_code)."
                    cat "$response"
                    exit 1
                  fi
                  node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.started) process.exit(1)' "$response"
                  echo 'Ford production content import started.'
                  completed=false
                  for attempt in $(seq 1 240); do
                    code=$(curl --silent --show-error --max-time 20 -o "$status_file" -w '%{http_code}' \
                      -c "$cookie_jar" -b "$cookie_jar" -H "X-Ford-Import-Token: $token" "$endpoint" || true)
                    if [ "$code" != "200" ]; then
                      echo "Ford production import status returned HTTP $code (attempt $attempt/240)."
                      sleep 15
                      continue
                    fi
                    state=$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.error){console.error("Ford production import error: "+String(x.error).slice(0,800));process.exit(2)} console.log(x.running?"running":(x.finishedAt?"finished":"idle"))' "$status_file") || exit 1
                    if [ "$state" = "finished" ]; then completed=true; break; fi
                    if [ "$state" = "idle" ]; then echo 'Ford production import ended without a completion time.'; exit 1; fi
                    if [ "$((attempt % 4))" = 0 ]; then echo "Ford production import still running (check $attempt/240)."; fi
                    sleep 15
                  done
                  if [ "$completed" != true ]; then echo 'Ford production import exceeded the 60-minute limit.'; exit 1; fi
                  curl --silent --show-error --fail --max-time 60 \
                    https://gp-fordcr-app-v1.azurewebsites.net/api/site-content -o "$catalog"
                  node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const c={families:x.families?.length||0,posts:x.posts?.length||0,videos:x.videos?.length||0,slides:x.home?.slides?.length||0,pages:x.pages?.length||0,familyTypes:x.site?.familyTypes?.length||0}; console.log("Ford production content counts: "+JSON.stringify(c)); if(c.families<10||c.posts<20||c.videos<5||c.slides<5||c.pages<10||c.familyTypes<3) process.exit(1)' "$catalog"
